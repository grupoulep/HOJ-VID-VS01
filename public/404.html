<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Portal de Voluntariado</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect with HTTPS enforcement
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var protocol = (l.hostname !== 'localhost' && l.hostname !== '127.0.0.1') ? 'https:' : l.protocol;
      l.replace(
        protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
